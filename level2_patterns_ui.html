 svgNode(svg,'text',{x:5,y:225,fill:'#a9bfd5','font-size':10},'量(手)');for(const i of [begin,end])svgNode(svg,'text',{x:i===begin?55:585,y:350,fill:'#a9bfd5','font-size':10,'text-anchor':i===begin?'start':'end'},d.dates[i]);
 const readout=make('p',parent,'悬浮K线查看当日价格、成交量和技术指标；键盘可用左右方向键。');readout.className='pattern-hover-detail';readout.style.minHeight='5em';readout.setAttribute('aria-live','polite');

 let hovered=end;const inspect=i=>{hovered=Math.max(begin,Math.min(end,i));cross.setAttribute('x1',x(hovered));cross.setAttribute('x2',x(hovered));cross.setAttribute('visibility','visible');const b=d.bars[hovered];if(!b){readout.textContent=d.dates[hovered]+' · qfq数据缺失或异常，不补值';return;}const prev=d.bars[hovered-1];const change=prev?(b[3]/prev[3]-1)*100:null;readout.textContent=`${d.dates[hovered]} · qfq 开 ${fmt(b[0])} / 高 ${fmt(b[1])} / 低 ${fmt(b[2])} / 收 ${fmt(b[3])} · 较前交易日 ${fmt(change,'%')} · 成交量 ${fmt(b[4])}手 · 成交额 ${fmt(b[5]===null?null:b[5]/100000,'亿')}；`+Object.entries(d.indicators[hovered]).map(([k,v])=>k+' '+fmt(v)).join(' / ');};
 svg.setAttribute('tabindex','0');svg.addEventListener('pointermove',ev=>{const rect=svg.getBoundingClientRect();inspect(begin+Math.floor(((ev.clientX-rect.left)*600/rect.width-55)/step));});svg.addEventListener('pointerleave',()=>cross.setAttribute('visibility','hidden'));svg.addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();inspect(hovered+(ev.key==='ArrowRight'?1:-1));}});
}
async function open(stock,event){const id=++detailRequest;content.replaceChildren();make('h3',content,stock.name+' '+stock.code);make('p',content,'读取形态证据…');if(!drawer.open)drawer.showModal();try{let d=frozen?ctx.patterns?.details?.[stock.code]:await api('/api/patterns/detail?'+new URLSearchParams({date:ctx.day,code:stock.code,receipt}));if(id!==detailRequest)return;if(!d)throw Error('此事件图未保存到快照，不读取最新文件');loaded[stock.code]=d;window.L2_PATTERN_CHARTS=Object.keys(loaded);content.replaceChildren();make('h3',content,stock.name+' '+stock.code);const chooser=select(content,'形态事件',Object.fromEntries(stock.events.map(e=>[e.eventId,e.name+' '+stageNames[e.stage]+' '+e.detectedDate])));chooser.value=event.eventId;
 const actions=make('div',content);actions.className='pattern-actions';const indicator=select(actions,'副图',{MACD:'MACD',RSI6:'RSI6',KDJ:'KDJ'});const maLabel=make('label',actions,'MA5／20 '),maCheck=make('input',maLabel);maCheck.type='checkbox';maCheck.checked=true;const signalLabel=make('label',actions,'形态标注 '),signalCheck=make('input',signalLabel);signalCheck.type='checkbox';signalCheck.checked=true;const plot=make('div',content),info=make('div',content);
 const update=()=>{const e=stock.events.find(x=>x.eventId===chooser.value)||event;plot.replaceChildren();info.replaceChildren();chart(plot,d,e,indicator.value,maCheck.checked,signalCheck.checked);make('p',info,`${e.name} · ${stageNames[e.stage]} · ${e.direction>0?'看涨':e.direction<0?'看跌':'中性'}结构；不是买卖信号`);make('p',info,`起始 ${e.startDate} · 首次识别 ${e.detectedDate} · 确认 ${e.confirmedDate||'未发生'} · 失效 ${e.invalidatedDate||'未发生'}`);make('p',info,'规则依据：'+e.evidence);make('p',info,`关键位 ${fmt(e.key)} · 失效位 ${fmt(e.stop)} · 当前距离 ${fmt(e.distance,'%')}；断档后生命周期${e.lifecycleUnknown?'未知':'按规则跟踪'}。`);const indicatorRow=d.indicators[e.confirmed??e.detected];make('p',info,'信号当日指标：'+Object.entries(indicatorRow).map(([k,v])=>k+' '+fmt(v)).join('；'));make('p',info,`报告日资金：净额比 ${fmt(stateFor(stock.code)?.level,'%')}；资金窗口 ${window.L2_CURRENT_STATE?.window||'未应用'}日。非信号当日资金，不回填历史。`);make('p',info,`截至 ${d.day} · 来源qfq复权口径（不依赖adj_factor） · 灰带缺失，不拼接 · 原始成交量不复权 · MA5金色/MA20蓝色；MACD：DIF金/DEA蓝/柱值紫线；KDJ：K金/D蓝/J紫。`);make('p',info,'当前来源指纹：'+d.identity+'；'+result.indicatorMethod);};chooser.onchange=indicator.onchange=maCheck.onchange=signalCheck.onchange=update;update();}catch(e){content.replaceChildren();make('p',content,e.message);}}
