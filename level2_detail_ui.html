<style>
.detail-compute{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.detail-compute span{flex:1;min-width:180px}.detail-compute button{flex:none;margin-left:auto;border-color:#53a8cc;cursor:pointer}.detail-compute button:disabled{opacity:.6;cursor:wait}.detail-compute small{flex-basis:100%;color:#bcd2e6}.detail-computed{padding:9px 12px;background:#102b32;border:1px solid #30705a;border-radius:8px}
</style>
<script>
(()=>{'use strict';
const originalOpen=openCard,states=new Map();let visibleCode=null,pollTimer;
const box=document.getElementById('detail'),dialog=document.getElementById('dlg');
function available(){return window.L2_CONTEXT?.mode!=='snapshot'&&location.protocol==='http:'&&location.hostname==='127.0.0.1';}
function controls(code){const x=D.cards.find(c=>c.code===code);if(!x||x.detail)return;
const warning=[...box.querySelectorAll('p.warn')].find(p=>p.textContent.includes('该股仅有全市场日级轨迹'));
if(!warning)return;
if(window.L2_CONTEXT?.mode==='snapshot'&&!x.computedDetail){warning.textContent='快照保存时未计算该股详情；只读模式不补算。';return;}
if(x.computedDetail){warning.className='detail-computed';warning.textContent='已按需计算：盘中五时段、主动成交关联委托及 order_raw 原始类型统计。补撤单语义仍未验证。';return;}
warning.classList.add('detail-compute');warning.textContent='';
const text=document.createElement('span');text.textContent='该股仅有全市场日级轨迹；盘中分段、关联单和 order_raw 深查未计算。';
const button=document.createElement('button');button.type='button';button.id='compute-detail';button.textContent='点击计算';button.addEventListener('click',()=>start(code));
const status=document.createElement('small');status.id='compute-status';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
warning.append(text,button,status);paint(code);}
function paint(code){if(visibleCode!==code||!dialog.open)return;const state=states.get(code),button=box.querySelector('#compute-detail'),status=box.querySelector('#compute-status');if(!button)return;
const busy=state&&['queued','running'].includes(state.status);button.disabled=!!busy;button.textContent=busy?'计算中…':state?.status==='error'?'重试计算':'点击计算';status.textContent=state?.message||'仅计算该股、当前报告日；结果保存在本机。';}
function apply(code,state){states.set(code,state);if(state.status==='done'){
 const x=D.cards.find(c=>c.code===code),r=state.result;
 if(!x||!r||r.code!==code||r.day!==D.markets.at(-1).day)throw Error('计算结果股票或日期不匹配');
 for(const key of ['segments','parents','orders','regularCoverage'])x[key]=r[key];x.computedDetail=true;
 if(visibleCode===code&&dialog.open){const top=dialog.scrollTop;originalOpen(code);controls(code);dialog.scrollTop=top;}
}else paint(code);}
async function request(path,options){const response=await fetch(path+'?date='+D.markets.at(-1).day,{...options,cache:'no-store'});if(!response.ok)throw Error('本地计算服务不可用或拒绝请求，请确认已启动 level2_detail_server.py');return response.json();}
async function refresh(code,quiet=false){try{const state=await request('/api/detail/'+encodeURIComponent(code));apply(code,state);if(['queued','running'].includes(state.status)&&visibleCode===code&&dialog.open){clearTimeout(pollTimer);pollTimer=setTimeout(()=>refresh(code),1500);}}catch(e){if(!quiet)apply(code,{status:'error',message:e.message});}}
async function start(code){if(!available()){apply(code,{status:'error',message:'请通过本地计算服务打开报告：python level2_detail_server.py；然后访问 http://127.0.0.1:18762/level2-market-scan_20260922.html'});return;}
apply(code,{status:'running',message:'正在提交该股计算请求…'});
try{apply(code,await request('/api/detail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}));if(visibleCode===code&&dialog.open)refresh(code);}catch(e){apply(code,{status:'error',message:e.message});}}
window.openCard=function(code){clearTimeout(pollTimer);visibleCode=code;originalOpen(code);controls(code);const x=D.cards.find(c=>c.code===code);if(x&&!x.detail&&available())refresh(code,true);};
dialog.addEventListener('close',()=>{clearTimeout(pollTimer);visibleCode=null;});
})();
</script>
