<style>
.kline-code{cursor:crosshair;border-bottom:1px dashed #6d9fbd;white-space:nowrap}.kline-code:hover,.kline-code:focus-visible{color:#bdeaff;outline:2px solid #53d4ff;outline-offset:3px}
.minute-code{display:inline-flex;align-items:center;justify-content:center;margin-left:7px;padding:1px 5px;min-width:24px;min-height:24px;vertical-align:middle;font-size:12px;line-height:1.4;color:#bdeaff;border:1px solid #416781;border-radius:4px;cursor:crosshair}.minute-code:hover,.minute-code:focus-visible{background:#23425a;outline:2px solid #53d4ff;outline-offset:2px}
#kline-preview{position:fixed;z-index:9999;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:14px;border:1px solid #4a7594;border-radius:12px;background:#0b1929;box-shadow:0 12px 40px #0009;color:#e7f0fa;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
#kline-preview[hidden]{display:none}#kline-preview header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}#kline-preview h3{margin:0;font-size:16px}#kline-preview small{display:block;color:#9fb4c9}#kline-preview button{padding:3px 9px}#kline-values{min-height:40px;font-variant-numeric:tabular-nums;margin:8px 0 0;color:#e7f0fa}#kline-chart{width:100%;display:block;touch-action:pan-y;outline-offset:2px}#kline-preview .kline-note{margin:5px 0 0;font-size:11px;color:#a6bad0;overflow-wrap:anywhere}#kline-preview .kline-warning{color:#edc88b}
</style>
<section id="kline-preview" role="region" aria-label="前复权日K线预览" hidden>
 <header><div><h3 id="kline-title"></h3><small id="kline-subtitle"></small></div><button type="button" id="kline-close" aria-label="关闭K线预览">关闭</button></header>
 <div id="kline-values" aria-live="polite"></div>
 <svg id="kline-chart" viewBox="0 0 530 238" tabindex="0" role="img" aria-label="前复权日K线，左右方向键查看各日价格"></svg>
 <p id="kline-legend" class="kline-note">红色空心＝收≥开 · 绿色实心＝收&lt;开；纵轴：元/股。移动到K线或用方向键查看开高低收。</p>
 <p id="kline-quality" class="kline-note kline-warning"></p>
 <details class="kline-note"><summary>数据与复权口径</summary><div id="kline-source"></div></details>
</section>
<script id="kline-data" type="application/json">__KLINE_PAYLOAD__</script>
<script>
(()=>{'use strict';
function candlePriceDomain(bars,anchor=null){
 let lo=Math.min(...bars.map(b=>b[3])),hi=Math.max(...bars.map(b=>b[2]));
 if(Number.isFinite(anchor)&&anchor>0){
  const deviation=Math.max(Math.abs(hi-anchor),Math.abs(lo-anchor));
  const radius=deviation+Math.max(deviation*.09,anchor*.003,.01);
  return [anchor-radius,anchor+radius];
 }
 const pad=Math.max((hi-lo)*.09,hi*.003,.01);
 return [lo-pad,hi+pad];
}
const K=JSON.parse(document.getElementById('kline-data').textContent);
const pop=document.getElementById('kline-preview'),svg=document.getElementById('kline-chart'),values=document.getElementById('kline-values');
const title=document.getElementById('kline-title'),sub=document.getElementById('kline-subtitle'),quality=document.getElementById('kline-quality');
const names=new Map(D.cards.map(x=>[x.code,x.name]));
let active=null,pinned=false,timer=null,selected=0,bars=[],xStep=0;
let chartDates=K.dates,minuteMode=false,preClose=null,loadTimer=null,pollTimer=null,chartRequest=0,chartController=null;
const trigger='.kline-code,.minute-code';
const fmt=v=>Number(v).toFixed(2),day=d=>`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
document.getElementById('kline-source').textContent=`来源：${K.source}。${K.method}。仅使用交易日期≤${K.target}的本地行；这是当前本地历史快照，不声称当时可得性已验证。缺失/停牌不补造。`;
function decorate(){document.querySelectorAll('#cards article.card h3 span.muted').forEach(el=>{if(el.classList.contains('kline-code'))return;el.classList.add('kline-code');el.dataset.code=el.textContent.trim();el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`${el.dataset.code} 前复权K线`);el.setAttribute('aria-controls','kline-preview');el.title='悬浮查看前复权日K线，点击固定';const minute=document.createElement('button');minute.type='button';minute.className='minute-code';minute.dataset.code=el.dataset.code;minute.textContent='分';minute.setAttribute('aria-label',`${el.dataset.code} 当日分钟K线`);minute.setAttribute('aria-controls','kline-preview');minute.title='悬浮查看报告当日一分钟K线，点击固定';el.after(minute);});}
new MutationObserver(decorate).observe(document.getElementById('cards'),{childList:true});decorate();
function hide(){window.L2_PENDING_CHART=false;chartRequest++;chartController?.abort();clearTimeout(timer);clearTimeout(loadTimer);clearTimeout(pollTimer);pop.hidden=true;pinned=false;active=null;}
function later(){clearTimeout(timer);if(!pinned)timer=setTimeout(hide,200);}
function position(el){const r=el.getBoundingClientRect();pop.style.maxHeight=`${innerHeight-24}px`;const natural=pop.offsetHeight,below=innerHeight-r.bottom-22,above=r.top-22;const useBelow=below>=natural||(above<natural&&below>=above);pop.style.maxHeight=`${Math.max(80,useBelow?below:above)}px`;const w=pop.offsetWidth,h=pop.offsetHeight;let left=Math.max(12,Math.min(r.left,innerWidth-w-12)),top=useBelow?r.bottom+10:r.top-h-10;pop.style.left=`${left}px`;pop.style.top=`${Math.max(12,top)}px`;}
function inspect(index){if(!bars.length)return;selected=Math.max(0,Math.min(bars.length-1,index));let b=bars[selected];values.textContent=`${minuteMode?chartDates[b[0]]:day(chartDates[b[0]])}　开 ${fmt(b[1])}　高 ${fmt(b[2])}　低 ${fmt(b[3])}　收 ${fmt(b[4])}` + `　量 ${b[5]==null?'未知':b[5].toLocaleString()+'手'}　额 ${b[6]==null?'未知':M(b[6])}${minuteMode&&preClose?'　涨跌 '+P((b[4]/preClose-1)*100):''}`;let cross=svg.querySelector('.kline-cross');if(cross){let x=52+(b[0]+.5)*xStep;cross.setAttribute('x1',x);cross.setAttribute('x2',x);}}
function draw(code,minute,kind){minuteMode=kind==='minute';preClose=minuteMode?minute.preClose:null;chartDates=minute.labels;let s=minute;bars=s?.bars||[];title.textContent=`${names.get(code)||''} ${code} · ${minuteMode?'当日1分钟K':'前复权日K'}`;sub.textContent=minuteMode?`${day(K.target)} · ${bars.length}/240条分钟数据 · 元/股 · 不复权${preClose?' · 0轴：昨收 '+fmt(preClose):' · 昨收缺失，0轴未知'}`:`${day(chartDates[0])} — ${day(K.target)} · ${bars.length}/${chartDates.length}个交易日有数据`;
pop.setAttribute('aria-label',minuteMode?'当日分钟K线预览':'前复权日K线预览');svg.setAttribute('aria-label',minuteMode?'当日一分钟K线及成交量，左右方向键查看各分钟价格':'前复权日K线，左右方向键查看各日价格');svg.setAttribute('viewBox',minuteMode?'0 0 590 296':'0 0 530 296');
document.getElementById('kline-source').textContent=minuteMode?`来源：${minute.source}。${minute.method}。0轴基准：报告日期对应 daily.pre_close（${minute.preCloseSource}），不使用开盘价或四舍五入涨跌幅反推。`:`来源：${minute.source}。${minute.method}。每次悬浮重新读取文件，仅使用交易日期≤${K.target}的本地行；不声称历史当时可得性已验证。`;
document.getElementById('kline-legend').textContent='红色空心＝收≥开 · 绿色实心＝收<开；纵轴：元/股。移动到K线或用方向键查看开高低收。'+(minuteMode?'下方柱形为成交量（手）；午休压缩；虚线为昨收0轴，右轴为相对昨收涨跌幅。':'下方柱形为成交量（手），按原始量展示，不随价格复权。');
svg.innerHTML='';values.textContent='';quality.textContent='';
if(!bars.length){quality.textContent=s?.reason||'本地无可用前复权数据';svg.setAttribute('height','60');return;}
svg.removeAttribute('height');const [lo,hi]=candlePriceDomain(bars,minuteMode?preClose:null);const y=p=>16+(hi-p)/(hi-lo)*190;xStep=466/chartDates.length;const bw=Math.max(minuteMode?.8:2,xStep*.58);
const parts=[];for(let t=0;t<5;t++){let p=lo+(hi-lo)*t/4,yy=y(p);parts.push(`<line x1="52" x2="518" y1="${yy}" y2="${yy}" stroke="#293e52"/><text x="45" y="${yy+4}" text-anchor="end" fill="#9fb4c9" font-size="11">${fmt(p)}</text>`);if(minuteMode&&preClose&&Math.abs(yy-y(preClose))>13)parts.push(`<text x="526" y="${yy+4}" fill="#9fb4c9" font-size="11">${P((p/preClose-1)*100)}</text>`);}
if(minuteMode&&preClose){const yy=y(preClose);parts.push(`<line class="minute-zero" x1="52" x2="518" y1="${yy}" y2="${yy}" stroke="#e7d6a2" stroke-width="1.4" stroke-dasharray="6 4"/><text x="526" y="${yy+4}" fill="#e7d6a2" font-size="11">0.00%</text>`);}
const present=new Set(bars.map(b=>b[0]));chartDates.forEach((d,i)=>{if(!present.has(i))parts.push(`<rect x="${52+i*xStep}" y="16" width="${xStep}" height="190" fill="#8697a0" opacity=".14"><title>${minuteMode?d:day(d)} 缺失数据，不插值</title></rect>`);});
bars.forEach((b,i)=>{let x=52+(b[0]+.5)*xStep,rise=b[4]>=b[1],color=rise?'#ff7d8a':'#55dda1',top=y(Math.max(b[1],b[4])),height=Math.max(1,Math.abs(y(b[1])-y(b[4])));parts.push(`<g><line x1="${x}" x2="${x}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${color}"/><rect x="${x-bw/2}" y="${top}" width="${bw}" height="${height}" stroke="${color}" fill="${rise?'#0b1929':color}"/><rect data-bar="${i}" x="${x-xStep/2}" y="12" width="${xStep}" height="200" fill="transparent"><title>${chartDates[b[0]]} 开${b[1]} 高${b[2]} 低${b[3]} 收${b[4]}</title></rect></g>`);});
parts.push('<line class="kline-cross" x1="0" x2="0" y1="12" y2="210" stroke="#c7d7e6" stroke-dasharray="3 3" pointer-events="none"/>');
{const vmax=Math.max(...bars.map(b=>b[5]??0),1);parts.push('<text x="45" y="228" text-anchor="end" fill="#9fb4c9" font-size="10">量(手)</text>');bars.forEach((b,i)=>{if(b[5]==null)return;let h=b[5]/vmax*38;parts.push(`<rect class="kline-volume" data-bar="${i}" x="${52+(b[0]+.5)*xStep-bw/2}" y="${268-h}" width="${bw}" height="${h}" fill="${b[4]>=b[1]?'#ff7d8a':'#55dda1'}"/>`);});if(minuteMode)parts.push('<line x1="285" x2="285" y1="16" y2="270" stroke="#9fb4c9" stroke-dasharray="2 3"/>');}
[0,Math.floor((chartDates.length-1)/2),chartDates.length-1].forEach((i,n)=>parts.push(`<text x="${n===0?52:n===2?518:285}" y="288" text-anchor="${n===0?'start':n===2?'end':'middle'}" fill="#9fb4c9" font-size="11">${minuteMode?(n===0?'09:30':n===1?'11:30 / 13:00':'15:00'):day(chartDates[i])}</text>`));svg.innerHTML=parts.join('');inspect(bars.length-1);
const missing=chartDates.filter((_,i)=>!present.has(i));quality.textContent=minuteMode?`${minute.quality} 本股零成交量分钟 ${minute.zeroVolumeMinutes} 个；缺失 ${missing.length} 个分钟（灰带，不额外补值）。`:(missing.length?`灰带为缺失数据日：${missing.slice(0,5).map(day).join('、')}${missing.length>5?` 等${missing.length}日`:''}；不补值、不视为零。`:'本窗口各交易日均有有效OHLC。');
quality.textContent+=window.L2_CONTEXT?.mode==='snapshot'?` 快照冻结；原读取时间：${new Date(minute.readAt).toLocaleString()}。`:` 本次本地读取：${new Date(minute.readAt).toLocaleTimeString()}；不使用上次图表缓存。`;const missingVolume=bars.filter(b=>b[5]==null).length;if(missingVolume)quality.textContent+=` ${missingVolume}条成交量未知（不补零）。`;
if(s.rejected)quality.textContent+=` 已排除${s.rejected}条异常OHLC。`;
}
async function loadChart(el,requestId){const code=el.dataset.code,kind=el.classList.contains('minute-code')?'minute':'day';const controller=new AbortController();chartController=controller;try{if(window.L2_CONTEXT?.mode==='snapshot'){const r=window.L2_CONTEXT.charts[kind+'/'+code];if(!r)throw Error('此图表未保存到快照，不能读取最新文件');if(requestId!==chartRequest||active!==el)return;draw(code,r,kind);position(el);return;}if(location.protocol!=='http:')throw Error('请通过本地计算服务打开此报告');const response=await fetch('/api/chart/'+kind+'/'+encodeURIComponent(code)+'?date='+K.target,{cache:'no-store',signal:controller.signal});const state=await response.json();if(active!==el||pop.hidden||requestId!==chartRequest)return;if(!response.ok||state.status!=='done')throw Error(state.message||'本地读取失败');const r=state.result;if(r.code!==code||r.day!==K.target)throw Error('图表股票或日期不一致');if(r.receipt&&window.L2_CAPTURE)window.L2_CAPTURE.charts[kind+'/'+code]=r.receipt;draw(code,r,kind);position(el);}catch(e){if(e.name!=='AbortError'&&active===el&&requestId===chartRequest){quality.textContent=e.message+'；移开后重新悬浮可重试。';position(el);}}finally{if(requestId===chartRequest)window.L2_PENDING_CHART=false;}}
function show(el,pin=false,refresh=false){clearTimeout(timer);if(active!==el||refresh){clearTimeout(loadTimer);clearTimeout(pollTimer);chartController?.abort();const requestId=++chartRequest;window.L2_PENDING_CHART=true;active=el;bars=[];svg.innerHTML='';svg.setAttribute('height','80');const isMinute=el.classList.contains('minute-code');title.textContent=`${names.get(el.dataset.code)||''} ${el.dataset.code} · ${isMinute?'当日1分钟K':'前复权日K'}`;sub.textContent=`截止 ${day(K.target)} · ${window.L2_CONTEXT?.mode==='snapshot'?'只读快照':'每次悬浮读取本地最新文件'}`;values.textContent=window.L2_CONTEXT?.mode==='snapshot'?'正在读取快照…':'正在读取本地价格与成交量…';quality.textContent=window.L2_CONTEXT?.mode==='snapshot'?'只读冻结数据，不读取最新文件。':'本次不使用上次图表缓存；读取失败不回退旧数据。';document.getElementById('kline-source').textContent=isMinute?'本地 stock_minute':'本地 stk_factor_pro';loadTimer=setTimeout(()=>loadChart(el,requestId),180);}pinned=pin;pop.hidden=false;position(el);}
document.addEventListener('pointerover',e=>{let el=e.target.closest(trigger);if(el&&e.pointerType!=='touch'&&!pinned&&!el.contains(e.relatedTarget))show(el,false,true);});
document.addEventListener('pointerout',e=>{if(e.target.closest(trigger)&&!pop.contains(e.relatedTarget))later();});
document.addEventListener('focusin',e=>{let el=e.target.closest(trigger);if(el)show(el);});
document.addEventListener('focusout',e=>{if(!pop.contains(e.relatedTarget)&&!e.relatedTarget?.closest?.(trigger))later();});
document.addEventListener('click',e=>{let el=e.target.closest(trigger);if(el){e.stopPropagation();e.preventDefault();if(active===el&&pinned)hide();else show(el,true);}else if(!pop.contains(e.target))hide();},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();const el=e.target.closest(trigger);if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(el,true);} });
svg.addEventListener('pointermove',e=>{let bar=e.target.closest('[data-bar]');if(bar)inspect(Number(bar.dataset.bar));});
svg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();inspect(selected+(e.key==='ArrowLeft'?-1:1));}});
pop.addEventListener('pointerenter',()=>clearTimeout(timer));pop.addEventListener('pointerleave',later);
document.getElementById('kline-close').addEventListener('click',hide);
pop.querySelector('details').addEventListener('toggle',()=>{if(active&&!pop.hidden)position(active);});
window.addEventListener('resize',()=>{if(active&&!pop.hidden)position(active);});
window.addEventListener('scroll',e=>{if(!pop.hidden&&!pop.contains(e.target))hide();},true);
})();
</script>
