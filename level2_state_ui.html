 function select(parent,key,label,options){const wrap=text(parent,'label',label);const el=text(wrap,'select','');el.dataset.key=key;el.setAttribute('aria-label',label);for(const [value,title] of Object.entries(options)){const o=text(el,'option',title);o.value=value;}controls.push(el);return el;}
 function number(parent,key,label,integer=false){const wrap=text(parent,'label',label);const el=text(wrap,'input','');el.type='number';el.step=integer?'1':'any';if(integer||key.startsWith('amount'))el.min=integer?'1':'0';el.placeholder='不限';el.dataset.key=key;el.setAttribute('aria-label',label);controls.push(el);}

 for(const [key,label] of [['buyDays','连续净买入至少几日'],['sellDays','连续净卖出至少几日'],['improveTimes','连续改善至少几次'],['worsenTimes','连续恶化至少几次']])number(grid,key,label,true);
 const status=text(host,'p','');status.className='state-caption';status.setAttribute('role','status');const clear=text(host,'button','清空全部筛选');clear.type='button';
 function update(){extraFilters={};filterInvalid=false;const chosen=[];for(const el of controls){if(el.value===''||el.value==='all')continue;const key=el.dataset.key;const value=el.type==='number'?Number(el.value):el.value;if(!el.checkValidity()||el.type==='number'&&!Number.isFinite(value))filterInvalid=true;extraFilters[key]=value;chosen.push(el.getAttribute('aria-label')+'：'+(el.type==='number'?el.value:el.selectedOptions[0].textContent));}
 for(const key of ['amount','level','delta','weighted','price'])if(extraFilters[key+'Min']!==undefined&&extraFilters[key+'Max']!==undefined&&extraFilters[key+'Min']>extraFilters[key+'Max'])filterInvalid=true;
 status.textContent=filterInvalid?'条件无效：请检查上下限顺序、金额非负、持续次数为正整数。':chosen.length?'同时满足 · '+chosen.join('；'):'未设高级限制；条件按同时满足组合，未知值不通过数值筛选。';page=1;renderStocks();}
 controls.forEach(el=>el.addEventListener(el.type==='number'?'input':'change',update));
 clear.onclick=()=>{controls.forEach(el=>el.value=el.type==='number'?'':'all');$('state-search').value='';$('state-filter').value='all';update();};update();
}
text(panel,'style',`#continuous-tools .sv-filters{padding:12px;border:1px solid #30475f;border-radius:9px;margin-bottom:12px}#continuous-tools .sv-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}#continuous-tools .sv-filter-grid label{font-size:11px;color:#aac0d6;min-width:0}#continuous-tools .sv-filter-grid input,#continuous-tools .sv-filter-grid select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:7px;font-size:12px}#continuous-tools .sv-filters summary{font-size:12px;color:#b9dcec}#continuous-tools .sv-filters>button{font-size:12px;padding:6px 10px}`);

function cards(){document.querySelectorAll('.state-evidence').forEach(e=>e.remove());if(!active)return;for(const article of document.querySelectorAll('#cards article')){const code=article.querySelector('[data-code]')?.dataset.code;const s=active.states[code];if(!s)continue;const box=document.createElement('div');box.className='state-evidence';text(box,'p',`净额比 ${num(s.level,'%')} · 日变化 ${num(s.delta,'个百分点')}`);text(box,'p',`${streak(s)} · ${transitions(s)}`);text(box,'p',`${active.window}日方向有效 ${s.valid}/${s.expected} · ${s.status==='AVAILABLE'?'可计算':'不足／未知'}`);article.append(box);}}
function details(){const box=$('detail');if(!box||!$('dlg')?.open)return;box.querySelector('.state-panel')?.remove();const code=box.querySelector('h2')?.textContent.match(/\d{6}\.(SH|SZ)/)?.[0];if(!code)return;const part=document.createElement('section');part.className='state-panel';text(part,'h3','连续状态 · '+(active?active.window+'交易日':'尚未计算'));const s=active?.states[code];if(s){text(part,'p',`${s.start}—${s.end}；方向有效 ${s.valid}/${s.expected} 日；成交额有效 ${s.amountValid}/${s.expected} 日。`);text(part,'p',`${streak(s)}；${transitions(s)}。${s.delta>0&&s.sign<0?'卖压减轻但仍为净卖出，不确认吸筹。':'仅为描述性证据，不构成交易触发。'}`);const table=document.createElement('table');for(const [label,value] of [['当前净额比',num(s.level,'%')],['较前日变化',num(s.delta,'个百分点')],['窗口金额加权净额比',num(s.weighted,'%')],['窗口趋势斜率',num(s.slope,'个百分点／交易日')],['当前成交额',money(s.amount)],['成交额日变化',num(s.amountChange,'%')],['窗口日均成交额',money(s.meanAmount)],['窗口复权价格变化',num(s.priceReturn,'%')]]){const row=document.createElement('tr');text(row,'th',label);text(row,'td',value);table.append(row);}part.append(table);text(part,'p','缺失或方向未知日期：'+(s.missing.join('、')||'无')+'；不足窗口不会缩短冒充完整窗口。');const raw=document.createElement('details');text(raw,'summary','逐日证据与计算口径');for(const r of s.history)text(raw,'p',`${r.day} · 成交额 ${money(r.amount)} · 已识别方向净额比 ${num(r.ratio,'%')} · ${r.reason||'方向记录可用'}`);text(raw,'p',active.priceMethod);text(raw,'p','斜率用每日净额比对交易日位置线性拟合；持续性限定当前窗口，触及窗口边界显示“至少”。停牌状态未接入，缺成交不推断为停牌。');part.append(raw);}else text(part,'p',frozen?'保存时未包含此窗口的连续状态。':'请先在连续观察中应用窗口；不使用旧标签推测新状态。');box.querySelector('h2')?.after(part);}
function apply(result){active=result;window.L2_CURRENT_STATE=result;window.dispatchEvent(new Event("l2-state-applied"));window.L2_STATE_WINDOW=result.window;input.value=result.window;status.textContent=`已应用 ${result.window}交易日，截止 ${result.day}；${frozen?'只读冻结结果':'本地日级计算结果'}。`;const all=Object.values(result.states),complete=all.filter(s=>s.status==='AVAILABLE').length;$('state-summary').textContent=`覆盖说明：${all.length}只股票中，方向窗口完整 ${complete} 只，其余 ${all.length-complete} 只不足或方向未知。价格和成交额按各自覆盖独立展示。`;renderBody();cards();details();}
async function api(path,data){const r=await fetch(path,{cache:'no-store',...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.message||'请求失败');return v;}
function busy(value){window.L2_PENDING_STATE=value;$('state-apply').disabled=value;}
function failure(e,id){if(id!==requestId)return;busy(false);status.textContent=`计算失败：${e.message}；${active?'仍展示 '+active.window+'交易日旧结果':'尚无结果'}。`;}
async function accept(r,n,id){if(id!==requestId)return;status.textContent=(r.message||'计算中')+(active?`；仍展示 ${active.window}交易日结果`:'');if(r.status==='done'){results.set(String(n),r.result);window.L2_CAPTURE.states[String(n)]=r.receipt;busy(false);apply(r.result);}else if(['running','queued'].includes(r.status)){timer=setTimeout(async()=>{try{await accept(await api('/api/state/status?date='+ctx.day+'&window='+n),n,id);}catch(e){failure(e,id);}},1800);}else failure(Error(r.message||'未知错误'),id);}
$('state-apply').onclick=async()=>{const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>(meta?.maxWindow||60)){status.textContent='请输入范围内的正整数交易日数。';return;}if(frozen){const r=results.get(String(n));if(r)apply(r);else status.textContent='快照中不可用；仍展示此前已应用窗口，不补读新数据。';return;}const id=++requestId;clearTimeout(timer);busy(true);status.textContent=`正在计算 ${n}交易日；${active?'仍展示 '+active.window+'交易日结果':'尚无结果'}。`;try{await accept(await api('/api/state',{day:ctx.day,window:n}),n,id);}catch(e){failure(e,id);}};
function pending(){requestId++;clearTimeout(timer);busy(false);status.textContent=`待应用 ${input.value}交易日；${active?'当前仍展示 '+active.window+'交易日结果':'尚无已应用结果'}。`;}
input.oninput=pending;$('state-minus').onclick=()=>{input.value=Math.max(1,Number(input.value||1)-1);pending();};$('state-plus').onclick=()=>{input.value=Math.min(meta?.maxWindow||60,Number(input.value||1)+1);pending();};panel.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>{input.value=b.dataset.window;pending();});
function navigate(offset){const i=meta?.days.indexOf(ctx.day),day=meta?.days[i+offset];if(day)location.href=location.pathname+'?'+new URLSearchParams({date:day,window:input.value});}
$('state-prev').onclick=()=>navigate(-1);$('state-next').onclick=()=>navigate(1);

else api('/api/state/meta').then(m=>{meta=m;input.max=m.maxWindow;input.value=new URLSearchParams(location.search).get('window')||m.defaultWindow;const i=m.days.indexOf(ctx.day);$('state-prev').disabled=i<=0;$('state-next').disabled=i<0||i>=m.days.length-1;}).catch(e=>{status.textContent='交易日历不可用：'+e.message;});

dius:8px}#continuous-tools .sv-count span{font-size:11px}#continuous-tools .sv-count strong{font-size:21px;margin:5px 0}#continuous-tools .sv-count small{font-size:10px;line-height:1.5}#continuous-tools .sv-transitions{font-size:11px;padding:8px 10px;margin:8px 0}@media(max-width:450px){#continuous-tools .sv-days{grid-template-columns:repeat(2,minmax(0,1fr))}#continuous-tools .sv-counts{grid-template-columns:repeat(2,minmax(0,1fr))}#continuous-tools .sv-hero-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}#continuous-tools .sv-hero-kpis .sv-metric:last-child{grid-column:1/-1}}`);
